services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Exposed directly on the VM as well as through the existing reverse proxy.
      - "8080:80"

volumes:
  backend-data:
  backend-logs:
